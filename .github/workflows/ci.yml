name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  GO_VERSION: "1.25.x"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: parser-service/requirements-import.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r parser-service/requirements-import.txt
      - name: Compile
        working-directory: parser-service
        run: python -m compileall -q app tests
      - name: Unit tests
        working-directory: parser-service
        run: python -m unittest discover -s tests -v
      - name: Pilot evaluation tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Deployment script regression tests
        run: python -m unittest discover -s deploy/tests -v

  go:
    name: Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgres://rehub:rehub@127.0.0.1:5432/rehub?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rehub
          POSTGRES_USER: rehub
          POSTGRES_PASSWORD: rehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rehub -d rehub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test
        working-directory: backend
        run: go test -p 1 ./...
      - name: Build
        working-directory: backend
        run: go build -trimpath -o "$RUNNER_TEMP/rehub-api" ./cmd/api

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Syntax check
        run: |
          find src -type f \( -name "*.js" -o -name "*.mjs" \) -not -path "*/vendor/*" -print0 \
            | xargs -0 -n1 node --check
        working-directory: frontend
      - name: Install test dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend tests
        run: node --test src/*.test.mjs
        working-directory: frontend

  compose:
    name: Compose smoke
    needs: [python, go, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: rehub-ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config --quiet
      - name: Start and run smoke tests
        run: make up smoke smoke-recovery
      - name: Verify parser imports through Go and PostgreSQL
        run: docker compose exec -T parser-service python - < scripts/smoke-parser.py
      - name: QA scenarios Q-01, Q-02, Q-04
        run: docker compose exec -T parser-service python - < scripts/qa/run_qa.py
      - name: Show service logs
        if: failure()
        run: docker compose logs --tail=150
      - name: Stop services
        if: always()
        run: make down

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy vulnerability and misconfiguration report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
      - name: Upload Trivy report
        if: always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  images:
    name: Build ${{ matrix.image }}
    needs: [python, go, frontend, compose, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      PUSH_IMAGES: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rehub-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: rehub-parser-service
            context: .
            dockerfile: ./parser-service/Dockerfile
          - image: rehub-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase repository owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: ${{ env.PUSH_IMAGES == 'true' }}
          sbom: ${{ env.PUSH_IMAGES == 'true' }}


  release:
    name: GitHub release
    needs: [images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  ci:
    name: ci
    if: always()
    needs: [python, go, frontend, compose, security, images, release]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks and image builds
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items()
                    if job["result"] != "success" and not
                    (name == "release" and job["result"] == "skipped")}
          if failed:
              raise SystemExit(f"Required jobs did not succeed: {failed}")
          PYTHON
