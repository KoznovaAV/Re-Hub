name: ${COMPOSE_PROJECT_NAME:-rehub}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rehub}
      POSTGRES_USER: ${POSTGRES_USER:-rehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      options: { max-size: "10m", max-file: "3" }

  parser-service:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/rehub-parser-service:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      PYTHON_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      options: { max-size: "10m", max-file: "3" }

  backend:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/rehub-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      BACKEND_ADDR: 0.0.0.0:8080
      PYTHON_SERVICE_URL: http://parser-service:8001
      DATABASE_URL: postgres://${POSTGRES_USER:-rehub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rehub}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
      parser-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      options: { max-size: "10m", max-file: "3" }

  frontend:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER is required}/rehub-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      WEB_HOST: 0.0.0.0
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
