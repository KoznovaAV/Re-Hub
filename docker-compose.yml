services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      PYTHON_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      BACKEND_ADDR: 0.0.0.0:8080
      PYTHON_SERVICE_URL: http://ai-service:8001
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      WEB_HOST: 0.0.0.0
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 10
