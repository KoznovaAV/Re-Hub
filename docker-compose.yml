services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rehub}
      POSTGRES_USER: ${POSTGRES_USER:-rehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rehub}
    volumes:
      - rehub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  parser-service:
    build:
      context: ./parser-service
      dockerfile: Dockerfile
    environment:
      PYTHON_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      BACKEND_ADDR: 0.0.0.0:8080
      PYTHON_SERVICE_URL: http://parser-service:8001
      DATABASE_URL: postgres://${POSTGRES_USER:-rehub}:${POSTGRES_PASSWORD:-rehub}@db:5432/${POSTGRES_DB:-rehub}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
      parser-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      WEB_HOST: 0.0.0.0
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  rehub_pgdata:
